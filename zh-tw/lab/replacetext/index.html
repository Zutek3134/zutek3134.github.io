<section class="container-wider">
    <article class="hero">
        <h1>線上文字替換</h1>
        <p>實用的線上文字尋找與取代代工具。支援多行內容替換，適用於各種文本處理場景。</p>
    </article>

<section class="container fullscreen">
    <article>
        <h2>原文</h2>
        <textarea id="inputText" class="text-input width-full" rows="6" placeholder="請輸入或貼上需要處理的文字⋯⋯"></textarea>
        <h3>替換規則</h3>
        <div id="rulesContainer"></div>
        <div id="middle-action-row">
            <div id="rule-toggles" class="text-small">
                <button id="caseSensitive" class="btn btn-toggle"><span class="toggle-indicator"><svg class="material-symbols-rounded" aria-hidden="true"><use href="/images/symbols_rounded.svg#check"></use></svg></span><span class="btn-label"><span>區分大小寫</span></span></button>
                <button id="matchWholeWord" class="btn btn-toggle"><span class="toggle-indicator"><svg class="material-symbols-rounded" aria-hidden="true"><use href="/images/symbols_rounded.svg#check"></use></svg></span><span class="btn-label"><span>僅替換單字</span></span></button>
                <button id="useRegex" class="btn btn-toggle"><span class="toggle-indicator"><svg class="material-symbols-rounded" aria-hidden="true"><use href="/images/symbols_rounded.svg#check"></use></svg></span><span class="btn-label"><span>使用正規表示式</span></span></button>
            </div>
            <button id="addRuleBtn" class="btn btn-fillbtn-fill btn-success text-small" aria-label="新空白規則" data-balloon-pos="up">
                <svg class="material-symbols-rounded" aria-hidden="true"><use href="/images/symbols_rounded.svg#add"></use></svg>
            </button>
        </div>

        <hr class="mar-t-1 mar-b-1">

        <div id="bottom-action-row">
            <button id="replaceAllBtn" class="btn btn-primary btn-fill">
                <svg class="material-symbols-rounded" aria-hidden="true"><use href="/images/symbols_rounded.svg#autorenew"></use></svg>
                <span>立即替換</span>
            </button>
            <button id="clearFieldsBtn" class="btn btn-danger btn-fill">
                <svg class="material-symbols-rounded" aria-hidden="true"><use href="/images/symbols_rounded.svg#delete"></use></svg>
                <span>全部清除</span>
            </button>
        </div>
    </article>
</section>

<section id="outputDiv" class="display-none mar-t-4 container fullscreen">
    <article>
        <h2>結果</h2>
        <p class="replace-stats">已替換 <span id="replaceStats"></span> 處</p>
        <p id="output" class="txtOutput mar-b-1"></p>
        <div id="result-action-row">
            <button id="wrapResultText" class="btn btn-toggle text-small"><span class="toggle-indicator"><svg class="material-symbols-rounded" aria-hidden="true"><use href="/images/symbols_rounded.svg#check"></use></svg></span><span class="btn-label"><span>文字換列</span></span></button>

                <span>複製到剪貼簿</span>
            </button>
        </div>
    </article>
