    <script>(() => {
    const CONFIG = {
        supportedLocales: ['zh-tw'],
        autoLowerCase: true,
        stripExtensions: true,
        enforceTrailingSlash: true,

        exact: {},

        prefixes: {
            '/labs/': '/lab/',
            '/game/': '/games/',
            '/discords/': '/discord/',
            '/zutek3134/': '/'
        },

        patterns: [
            [/^\/zh[-_]tw(\/|$)/i, '/zh-tw/']
        ]
    };

    const originalPath = window.location.pathname;
    let path = originalPath.replace(/\/+/g, '/');

    for (const [regex, replacement] of CONFIG.patterns) {
        if (regex.test(path)) {
            path = path.replace(regex, replacement);
            break;
        }
    }

    if (CONFIG.autoLowerCase) {
        path = path.toLowerCase();
    }

    if (CONFIG.stripExtensions) {
        path = path.replace(/\.(html?|php)$/i, '/');
    }

    const segments = path.split('/').filter(Boolean);
    let localePrefix = '';
    let coreSegments = segments;

    if (segments.length > 0) {
        const potentialLocale = segments[0].toLowerCase();

        if (CONFIG.supportedLocales.includes(potentialLocale)) {
            localePrefix = `/${potentialLocale}`;
            coreSegments = segments.slice(1);
        } else if (potentialLocale === 'zh') {
            localePrefix = '/zh-tw';
            coreSegments = segments.slice(1);
        } else if (/^[a-z]{2}(-[a-z]{2,4})?$/i.test(potentialLocale)) {
            localePrefix = '';
            coreSegments = segments.slice(1);
        }
    }

    let coreRoute = '/' + coreSegments.join('/') + (coreSegments.length > 0 || path.endsWith('/') ? '/' : '');
    coreRoute = coreRoute.replace(/\/+/g, '/');

    let rewrittenCore = coreRoute;
    if (CONFIG.exact[rewrittenCore]) {
        rewrittenCore = CONFIG.exact[rewrittenCore];
    }

    for (const [prefix, replacement] of Object.entries(CONFIG.prefixes)) {
        if (rewrittenCore.startsWith(prefix)) {
            rewrittenCore = replacement + rewrittenCore.slice(prefix.length);
            break;
        }
    }

    let finalPath = (localePrefix + rewrittenCore).replace(/\/+/g, '/');
    if (CONFIG.enforceTrailingSlash && !finalPath.endsWith('/') && !finalPath.split('/').pop().includes('.')) {
        finalPath += '/';
    }

    if (finalPath !== originalPath && finalPath !== '//') {
        window.location.replace(finalPath + window.location.search + window.location.hash);
        return;
    }

    if (localePrefix !== '') {
        let fallbackPath = rewrittenCore;
        if (CONFIG.enforceTrailingSlash && !fallbackPath.endsWith('/') && !fallbackPath.split('/').pop().includes('.')) {
            fallbackPath += '/';
        }
        fallbackPath = ('/' + fallbackPath).replace(/\/+/g, '/');

        if (fallbackPath !== originalPath && fallbackPath !== '//') {
            window.location.replace(fallbackPath + window.location.search + window.location.hash);
            return;
        }
    }
})();

document.addEventListener('DOMContentLoaded', () => {
    const userLang = (navigator.languages?.[0] || navigator.language || 'en').toLowerCase();

        document.documentElement.lang = 'zh-tw';
    }

    window.Utils.scrollToTop() || window.scrollTo(0, 0);
});</script>
